<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090a" />
    <meta name="description" content="A small free-roaming fireside afterlife park." />
    <title>Zozo's Last Light</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090a'/%3E%3Cpath d='M18 51V27c0-10 6-16 14-16s14 6 14 16v24l-7-5-7 5-7-5-7 5Z' fill='%23eee5cf'/%3E%3Ccircle cx='27' cy='29' r='2.5' fill='%23101112'/%3E%3Ccircle cx='37' cy='29' r='2.5' fill='%23101112'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <canvas id="viewport" aria-label="Interactive Halloween diorama"></canvas>
      <div id="ui-root">
        <div class="loading" id="loading" role="status" aria-live="polite">
          <div class="loading__mark">✦</div>
          <div class="loading__title">ZOZO'S LAST LIGHT</div>
          <div class="loading__line"><i></i></div>
          <div class="loading__status">Lighting the little fire</div>
        </div>

        <header class="masthead" aria-label="Diorama title">
          <div class="masthead__eyebrow">A SMALL AFTERLIFE</div>
          <div class="masthead__title">Zozo's Last Light</div>
          <div class="masthead__place"><span class="place-dot"></span><span id="place-label">GRAVEYARD</span></div>
        </header>

        <div class="chapter" aria-label="Chapter title">
          <div class="chapter__caption" id="chapter-label">A FIRESIDE INTRODUCTION</div>
        </div>

        <section class="hud" aria-label="Ghost tools">
          <div class="hud__icons">
            <div class="hud__icon" title="Warm fire" aria-label="Warm fire">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2.6c.8 4.1 5.8 5.5 5.8 10.4a6 6 0 0 1-12 0c0-2.1 1.1-3.7 2.5-5.2.1 2.1 1 3.1 2 3.7-.3-3.5 1.2-5.9 1.7-8.9Z"/><path d="M12.1 12.2c-1.3 1.6-2.3 2.7-2.3 4.4a2.3 2.3 0 0 0 4.6 0c0-1.6-.9-2.8-2.3-4.4Z"/></svg>
            </div>
            <div class="hud__icon" title="Ghost movement" aria-label="Ghost movement">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 19.8V10a6.8 6.8 0 0 1 13.6 0v9.8l-2.1-1.6-2.3 1.6-2.4-1.6-2.2 1.6-2.4-1.6-2.2 1.6Z"/><circle cx="9.4" cy="10.5" r="1.1"/><circle cx="14.6" cy="10.5" r="1.1"/></svg>
            </div>
            <div class="hud__icon" title="Follow the paw" aria-label="Follow the paw">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 13.1c-2.1 0-3.7 1.6-3.7 3.4 0 1.6 1.3 2.6 3 2.6 1 0 1.7-.4 2.5-.4.8 0 1.5.4 2.5.4 1.7 0 3-1 3-2.6 0-1.8-1.6-3.4-3.7-3.4-.8 0-1.4.3-2.1.7-.7-.4-1.3-.7-1.5-.7Z"/><ellipse cx="5.6" cy="8.7" rx="1.7" ry="2.2" transform="rotate(-25 5.6 8.7)"/><ellipse cx="10" cy="6.7" rx="1.7" ry="2.3" transform="rotate(-6 10 6.7)"/><ellipse cx="14.4" cy="6.7" rx="1.7" ry="2.3" transform="rotate(6 14.4 6.7)"/><ellipse cx="18.5" cy="8.7" rx="1.7" ry="2.2" transform="rotate(25 18.5 8.7)"/></svg>
            </div>
          </div>
          <div class="hud__caption">A FIRESIDE INTRODUCTION</div>
        </section>

        <div class="interaction-prompt" id="interaction-prompt" hidden>
          <span class="interaction-prompt__key">E</span>
          <span id="interaction-text">PET ZOZO</span>
        </div>

        <div class="tools interactive">
          <button class="tools__button" id="tools-button" type="button" aria-label="+ TOOLS" aria-expanded="false" aria-controls="tools-panel">
            <span class="tools__plus" aria-hidden="true">+</span><span>TOOLS</span>
          </button>
          <div class="tools__panel" id="tools-panel" hidden>
            <div class="tools__heading">Little rituals</div>
            <button class="tools__action" id="pause-button" type="button"><span class="tools__key">P</span><span id="pause-label">Pause the scene</span></button>
            <button class="tools__action" id="replay-button" type="button"><span class="tools__key">R</span><span>Reset position</span></button>
          </div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="modal" id="grave-modal" hidden>
          <div class="modal__backdrop" data-close-modal></div>
          <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="grave-title">
            <button class="modal__close" id="modal-close" type="button" aria-label="Close epitaph">×</button>
            <div class="modal__eyebrow">HERE LIES</div>
            <h1 class="modal__title" id="grave-title">ZOZO</h1>
            <div class="modal__rule"></div>
            <p class="modal__line">She was a wonderful dog.</p>
            <p class="modal__line">A bit gassy.</p>
            <p class="modal__line">Still is.</p>
          </section>
        </div>
      </div>
    </main>
    <noscript>This diorama needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
